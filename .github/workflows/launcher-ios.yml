name: iOS launcher build

on:
  workflow_dispatch:
  push:
    branches:
      - a14-launcher-prototype
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec launcher/project.yml --project launcher

      - name: Build for iPhone hardware
        run: |
          xcodebuild \
            -project launcher/NXNativeLauncher.xcodeproj \
            -scheme NXNativeLauncher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/NXNative.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/NXNative-unsigned.ipa
          test -s build/NXNative-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NXNative-iOS-unsigned-IPA
          path: build/NXNative-unsigned.ipa
          if-no-files-found: error
