name: BC texture decoder tests

on:
  workflow_dispatch:
  push:
    branches:
      - a14-launcher-prototype
    paths:
      - "dm/gfx/tex/nvn_bc_decode.*"
      - "dm/gfx/tex/tests/t_bc_decode.c"
      - "dm/third_party/bcdec/**"
      - "dm/gfx/tex/tests/Makefile"
      - ".github/workflows/bc-texture-decoder.yml"

permissions:
  contents: read

jobs:
  decoder:
    name: Build and test BC1-BC7 decoder
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run decoder tests
        run: make -C dm/gfx/tex/tests run-bc
      - name: Run address and undefined behavior sanitizers
        run: make -C dm/gfx/tex/tests asan-bc
