name: A14 CPU target validation

on:
  workflow_dispatch:
  push:
    branches:
      - a14-launcher-prototype
    paths:
      - "dm/ios/project.yml"
      - "dm/ios/tools/compile_check.py"
      - "dm/ios/tests/test_cpu_target.py"
      - ".github/workflows/a14-cpu.yml"

permissions:
  contents: read

jobs:
  cpu-target:
    name: Verify A14 compiler feature baseline
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Test A14 CPU target
        run: python3 dm/ios/tests/test_cpu_target.py
