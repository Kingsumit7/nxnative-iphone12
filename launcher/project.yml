name: NXNativeLauncher
options:
  bundleIdPrefix: org.nxnative
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NXNativeLauncher:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxnative.launcher
        PRODUCT_NAME: NXNative
        INFOPLIST_KEY_CFBundleDisplayName: NXNative
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
schemes:
  NXNativeLauncher:
    build:
      targets:
        NXNativeLauncher: all
    run:
      config: Debug
