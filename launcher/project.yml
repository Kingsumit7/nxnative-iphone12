name: NXNativeLauncher
options:
  bundleIdPrefix: org.nxnative
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  NXNativeLauncher:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nxnative.launcher
        PRODUCT_NAME: NXNative Launcher
        INFOPLIST_KEY_CFBundleDisplayName: NXNative Launcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
schemes:
  NXNativeLauncher:
    build:
      targets:
        NXNativeLauncher: all
    run:
      config: Debug
